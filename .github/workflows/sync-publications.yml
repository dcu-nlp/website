name: Sync publications

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sync-publications
      cancel-in-progress: true
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync publication data
        run: npm run sync:publications

      - name: Validate publication data and site
        run: npm test && npm run build

      - name: Commit publication updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/publications.json src/data/generated/author-identities.json
          if git diff --cached --quiet; then
            echo "No publication changes to commit"
            exit 0
          fi
          git commit -m "chore: sync publications"
          git push
